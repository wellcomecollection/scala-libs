name: "Run tests"

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      # One broken project shouldn't cancel the others and hide their results
      fail-fast: false
      matrix:
        service:
          - fixtures
          - http
          - http_typesafe
          - json
          - typesafe_app
          - monitoring
          - monitoring_typesafe
          - messaging
          - messaging_typesafe
          - storage
          - storage_typesafe
          - elasticsearch
          - elasticsearch_typesafe
          - sierra
          - sierra_typesafe
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.GHA_SCALA_LIBS_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Run sbt tests
        run: ./builds/run_sbt_tests.sh ${{ matrix.service }}

      # A failed test run skips dockerComposeStop, so the containers are still there
      - name: Show Docker Compose container logs
        if: failure()
        run: |
          for id in $(docker ps --all --quiet); do
            docker inspect --format '==> {{.Name}} ({{.Config.Image}}): {{.State.Status}}, exit code {{.State.ExitCode}}' "$id"
            docker logs --tail 300 "$id" 2>&1
          done
